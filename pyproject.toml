[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datadoctor"
version = "0.1.0"
description = "An automated data cleaning and ML pipeline preparation library."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Your Name", email = "you@example.com" },
]
dependencies = [
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "joblib>=1.4",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
imbalance = ["imbalanced-learn>=0.12"]